# 공통 명세 설정값 (계약 v1 후보, 2026-11-23 회의 후 고정). 이 파일만으로 서버에 연결되거나 실험이 실행되지는 않음.
# 경로·컬렉션 정보 출처: CHECK.md (2026-11-22 조회). "소유자 동의 대기" 항목은 회의(D12)에서 확인.
dataset:
  name: NQ
  chunks: 1000000
  chunking: 64word
  docs: 27133
  embed_model: sentence-transformers/all-MiniLM-L6-v2   # dim 384
  # 원본은 복사하지 않고 참조(D2). 실행 시작 시 길이와 md5 자동 검사. junlim 수정·이동 금지 동의 대기.
  root: /workspace/junlim/data_nq                  # 소유자 junlim (vdb03)
  files:
    chunks:     {path: /workspace/junlim/data_nq/chunks.jsonl, md5: aca9a920015623875a4ce7fe0ac7c502}  # junlim, 1,000,000줄
    doc_idx:    {path: /workspace/junlim/data_nq/doc_idx.npy, md5: 3f79e043f45ea5fb75011b4e0ce6a364}       # junlim, int64, 단조 증가
    pk_seq:     {path: /workspace/junlim/data_nq/pk_seq.npy, md5: db6977c5c80070191ddd340c8a4b3175}        # junlim, 항등 (pk == 줄 번호)
    chunk_vecs: {path: /workspace/junlim/data_nq/chunk_vecs.npy, md5: 97bcdc9a371b0725c651ef3ed6c78706}    # junlim, float32 (fp16 반올림 값), norm ≈ 1.0004
    queries:    {path: /workspace/junlim/data_nq/queries.jsonl, md5: 928acd35f9f65c5d2f04e5b0721044b6}     # junlim, real 3,452 (0~3451) + pseudo 100,000
    query_vecs: {path: /workspace/junlim/data_nq/query_vecs.npy, md5: b03bfe8a092269aa2cc3f0cc7f2e6377}    # junlim, float32 (103,452 × 384)
    gold:       {path: /workspace/junlim/pf3_out/nq_gold.jsonl, md5: 95ae90dcccc0401660da7ce922edaa6b}  # junlim, 3,452줄, ans 있음 2,255
    flags:      {path: /workspace/junlim/pf3_out/nq_flags.npy, md5: 5d007e77ac924dbd1602d1a8fa848fd3}   # junlim, uint8, 64단어용
    qrels_chunk: {path: /workspace/jaeeun/sel_fetch/data/qrels_chunk.tsv, md5: f8d2753f1addb62bfc22fb77589a1b05}   # jaeeun
    chunk_meta: {path: /workspace/jaeeun/sel_fetch/data/chunk_meta.npz, md5: 450e85b96eda5de963e3dac4c76a2df3}     # jaeeun, doc_idx / chunk_idx / nbytes
  # md5: 전 파일 고정. chunks·gold·flags는 CHECK.md(11-22) 값, 나머지 7개는 B0 smoke 첫 실행(2026-11-23 11:26 KST,
  # results/b0_smoke_20261123_112611/run_meta.json)에서 계산해 채움. 실행 시작 시 모두 검사하고 다르면 중단.
  # md5: null인 파일을 새로 추가하면 첫 실행 때 계산해 실행 메타에 기록한다.
  # 주의: /workspace/junlim/gold_w100/ 은 100단어용(섞지 말 것), /workspace/junlim/data/ 는 FiQA.
  file_store:                                      # 파일 경로 C1·블록 수 계산용 (Milvus 경로 아님)
    seq:  {data: /workspace/jaeeun/sel_fetch/data/chunk_store_seq.bin, offset: /workspace/jaeeun/sel_fetch/data/chunk_store_off.npy}   # jaeeun
    doc:  {data: /workspace/jihyeon/c1_w13/store/doc.bin, offset: /workspace/jihyeon/c1_w13/store/doc_off.npy}     # jihyeon
    rand: {data: /workspace/jihyeon/c1_w13/store/rand.bin, offset: /workspace/jihyeon/c1_w13/store/rand_off.npy}   # jihyeon
    length: /workspace/jihyeon/c1_w13/store/len.npy                                                                 # jihyeon
    block: 4096

milvus:
  version_target: 2.6.23
  uri: http://localhost:19530
  # D1: 기본 A = junlim/nq_seq (검색 + 본문). 상태: 제안(소유자 동의 대기, junlim)
  # 동의를 못 받으면 대안 C: search = jaeeun/nq1m_sel, fetch = jihyeon/w13c1_doc (본문은 jihyeon 동의 필요)
  # D(새로 적재)는 Milvus 저장소 디스크 확인 전까지 보류.
  search:
    database: junlim
    collection: nq_seq          # HNSW IP M=16 efC=200, pk == chunk_id. 대안 C: jaeeun / nq1m_sel
  fetch:
    database: junlim
    collection: nq_seq          # text VARCHAR(4096), text mmap on. 대안 C: jihyeon / w13c1_doc
    layout: seq
  c1_compare:                   # C1 배치 비교 전용(본문 조회만, 가짜 8차원 벡터라 검색 금지). 제안(소유자 동의 대기, jihyeon)
    database: jihyeon
    doc:  {collection: w13c1_doc,  layout: doc,  pk_map: identity}
    rand: {collection: w13c1_rand, layout: rand, pk_map: /workspace/jihyeon/c1_w13/milvus_meta/pk_rand.npy}   # chunk_id → pk
  # load/release 시간표: 회의에서 확정(D12). 점검 당시 모든 컬렉션 NotLoad. 남의 컬렉션의 mmap·인덱스 설정은 바꾸지 않음.
  load_schedule: TO_BE_CONFIRMED

ann:
  index: HNSW
  metric: IP
  search_topk: 10               # B0와 C3 비교. 규칙: ef >= search_topk
  context_topk: 10
  ef: 64
  c2_compare:                   # C2 비교(대조군 ANN Top-(10+k) 포함) 전용 (D9)
    search_topk: 40
    context_topk: 10
    ef: 64                      # ef >= search_topk 만족
    check_top10_consistency: true   # search_topk 40 hits의 상위 10개 == search_topk 10 결과인지 첫 실행에서 확인, 실행 메타에 기록
  # 2차 선별 대비(참고만): search_topk 100, ef 256, context_topk 10

c2:
  impl: none_ref                # 구현 이름(modules/registry). 기본 = reference(none만). 담당자 구현 등록 후 교체
  policy: none                  # 기본(B0). none / BC1 / all
  integration_policy: BC1       # 통합 주 결과 조건
  neighbor_window: 1            # 같은 문서 ±1
  # 대조군(D8)은 실험 계층에서 생성: 질문별로 수를 맞춘 ANN Top-(10+k), R3(같은 ±1 이웃 후보 안 무작위, seed 20개). 토큰 수는 보고만.

c1:
  impl: file_ref                # 구현 이름. 기본 = reference(파일 저장소 seq, chunk별 pread). 담당자 구현 등록 후 교체
  layout: seq                   # 실제 물리 배치를 가리킴(seq / doc / rand). 단순 ON/OFF 아님
  fetch_mode: batch             # individual / batch. range는 1차 제외(D7)
  batch_impl: query_pk_in       # D6: query(filter="pk in [...]"). get(ids)는 C1 비교 항목
  compare:
    layouts: [doc, rand]        # 같은 ANN 결과로 milvus.c1_compare 컬렉션에서 본문 읽기 비교
    batch_impls: [query_pk_in, get]
    fetch_modes: [batch, individual]

c3:
  impl: serial_ref              # 구현 이름. 기본 = reference(동시성 없음). 담당자 구현 등록 후 교체
  mode: m3                      # m3 / m7
  clients: 64                   # 주 조건(기존 m7 비교 조건)
  clients_aux: 16               # 보조 조건
  cap: 8                        # m7에만 적용
  warmup_s: 5
  duration_s: 20
  repetitions: 3
  order: interleaved            # 조건 순서 교차
  c2_policy: BC1                # D5: 통합 주 결과
  legacy_check:                 # 기존 C3 수치와 이어 보는 확인용, 1회만
    c2_policy: all
    modes: [m3, m7]
    clients: 64
    repetitions: 1

query_sets:                     # 질문 키 = (query_set, q_idx)
  nq_test_real:
    queries: /workspace/junlim/data_nq/queries.jsonl
    vectors: /workspace/junlim/data_nq/query_vecs.npy
    q_idx: [0, 3451]            # real 3,452개. 3452 이후는 pseudo(정답 없음) → 사용 안 함
    use: 성능 측정. 고정 seed 순서로 순환 (기존 C3의 pseudo 포함 무작위 복원 추출과 다름)
  nq_test_ans:
    queries: /workspace/junlim/data_nq/queries.jsonl
    vectors: /workspace/junlim/data_nq/query_vecs.npy
    gold: /workspace/junlim/pf3_out/nq_gold.jsonl
    count: 2254                 # ans 있음 2,255 중 c2x 평가기 기준 평가 가능 2,254. q_idx 목록은 첫 구현 때 파일로 고정·md5 기록
    use: 품질 주 평가
  c2x_test:
    queries: /workspace/jaeeun/sel_fetch_c2x/results/test_queries.jsonl   # NQ train에서 뽑은 2,000개, 정답 포함
    vectors: /workspace/jaeeun/sel_fetch/data/q_train_minilm.npy          # 행 매핑은 q_train_minilm_meta.jsonl / train_row 기준
    count: 2000
    use: C2 대조군의 독립 검증용 보조. q_idx가 0부터 다시 시작하는 다른 번호 체계

run:                            # 실행 설정 (main.py). 실행별 값은 runs/*.yaml overlay나 --set으로 덮어씀
  name: run                     # 결과 폴더 이름 앞부분: results/<name>_<KST 시각>/
  query_set: nq_test_ans        # nq_test_real / nq_test_ans / c2x_test
  n_queries: null               # null = query_set 전체(experiment.seed 순서). 정수면 앞 n개
  max_queries: null             # null = 시간 기반(warmup_s + duration_s). 정수면 그 수만큼 실행(품질 평가용, C3 계약)
  warmup_s: null                # null = c3.warmup_s
  duration_s: null              # null = c3.duration_s
  evaluate: true                # 정답 문자열 포함률 (본문은 메모리에서만 쓰고 결과 파일에 넣지 않음)
  text_check_n: 200             # chunks.jsonl 원문과 대조할 본문 수 (샘플)
  verify_search_doc_idx: false  # 검색 결과 doc_idx를 ChunkMeta와 대조 (스모크용)
  milvus_allowed_load: []       # load/release를 허용할 "<db>/<collection>". 비어 있으면 load 안 함(시간표 D12)
  preflight_sample_s: 10        # load 전 사용 중 검사 표본 시간(초)
  metrics_url: http://localhost:9091/metrics
  out_dir: results

metrics:
  quality: [answer_string_hit_rate, fetched_chunks, fetched_bytes]
  performance: [qps, p50_ms, p95_ms, p99_ms, stage_ms, n_requests, error_rate]

experiment:
  seed: 42
  smoke_queries: 10
  warmup: true
  repetitions: 3
  cache_condition: warm         # 물리 I/O 주장은 cold 조건 또는 파일 경로에서만(D11)
  run_meta:                     # 실행마다 기록
    - measured_at_kst           # 측정 시작·종료 시각
    - load_state                # 모든 컬렉션의 load 상태 (측정 전후)
    - milvus_reset_log          # 관리자 스위치 reset 기록 (가능하면)
    - swap_used                 # 호스트 swap 사용량
    - md5_check                 # 원본 파일 길이·md5 검사 결과
    - other_user_activity       # 다른 사용자 프로세스, Milvus CPU·요청 수
    - milvus_metrics_delta      # 구간 단위 Milvus 저장소 읽기 메트릭 차이 (질문 단위 값으로 쓰지 않음)
    - top10_consistency         # C2 비교: search_topk 40 상위 10개와 search_topk 10 결과의 일치 여부 (D9, 첫 실행)
